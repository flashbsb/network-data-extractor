# ==============================================================================
# Network Data Extractor - Master Multivendor ICMP Ping Commands List
# Parameters available (via injection): {ip}, {source_ip}, {count}, {size}, {timeout}
# Format: <commands_key>;<cli_command>
# Keys are case-insensitive and support both mixed-case and lowercase formats.
# ==============================================================================

# ------------------------------------------------------------------------------
# Cisco IOS (Classic - No size/timeout in standard CLI syntax)
# ------------------------------------------------------------------------------
cisco_ios;ping {ip} source {source_ip} repeat {count}
Cisco_IOS;ping {ip} source {source_ip} repeat {count}

# ------------------------------------------------------------------------------
# Cisco IOS XE (Production & Standard)
# ------------------------------------------------------------------------------
Cisco_IOS_XE;ping {ip} source {source_ip} repeat {count} size {size} timeout {timeout}
cisco_ios_xe;ping {ip} source {source_ip} repeat {count} size {size} timeout {timeout}

# ------------------------------------------------------------------------------
# Cisco IOS XR (Production & Standard)
# ------------------------------------------------------------------------------
Cisco_IOS_XR;ping {ip} source {source_ip} count {count} size {size} timeout {timeout}
cisco_ios_xr;ping {ip} source {source_ip} count {count} size {size} timeout {timeout}

# ------------------------------------------------------------------------------
# Cisco IOS XR (Legacy Versions)
# ------------------------------------------------------------------------------
Cisco_IOS_XR_OLD;ping {ip} source {source_ip} count {count} size {size} timeout {timeout}
cisco_ios_xr_old;ping {ip} source {source_ip} count {count} size {size} timeout {timeout}

# ------------------------------------------------------------------------------
# Cisco NX-OS
# ------------------------------------------------------------------------------
cisco_nxos;ping {ip} source {source_ip} count {count} packet-size {size} timeout {timeout}
Cisco_NXOS;ping {ip} source {source_ip} count {count} packet-size {size} timeout {timeout}

# ------------------------------------------------------------------------------
# Datacom DMOS (Production - DMOS CLI does not accept timeout parameter)
# ------------------------------------------------------------------------------
DATACOM_DMOS;ping {ip} source {source_ip} count {count} size {size}
datacom_dmos;ping {ip} source {source_ip} count {count} size {size}

# ------------------------------------------------------------------------------
# Datacom DMOS (Legacy Versions - DMOS legacy does not accept size/timeout)
# ------------------------------------------------------------------------------
DATACOM_DMOS_OLD;ping {ip} source {source_ip} count {count}
datacom_dmos_old;ping {ip} source {source_ip} count {count}

# ------------------------------------------------------------------------------
# Huawei VRP
# ------------------------------------------------------------------------------
huawei_vrp;ping -a {source_ip} -c {count} -s {size} -t {timeout} {ip}
Huawei_VRP;ping -a {source_ip} -c {count} -s {size} -t {timeout} {ip}