# ==============================================================================
# Network Data Extractor - ICMP Ping Commands List
# Parametros disponíveis (via injecao): {ip}, {source_ip}, {count}, {size}, {timeout}
# Formato: <commands_key>;<cli_command>
# ==============================================================================

# Cisco IOS
cisco_ios;ping {ip} source {source_ip} repeat {count} size {size} timeout {timeout}

# Cisco IOS XE
cisco_ios_xe;ping {ip} source {source_ip} repeat {count} size {size} timeout {timeout}

# Cisco NX-OS
cisco_nxos;ping {ip} source {source_ip} count {count} packet-size {size} timeout {timeout}

# Cisco IOS XR
cisco_ios_xr;ping {ip} source {source_ip} count {count} size {size} timeout {timeout}

# Datacom DMOS
datacom_dmos;ping {ip} source {source_ip} count {count} size {size} timeout {timeout}

# Huawei VRP
huawei_vrp;ping -a {source_ip} -c {count} -s {size} -t {timeout} {ip}